<div class="toast-container" aria-label="Thông báo">
  @for (toast of notifications.toasts(); track toast.id) {
    <div class="toast" [class.toast-success]="toast.type === 'success'"
      [class.toast-error]="toast.type === 'error'" [class.toast-warning]="toast.type === 'warning'"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'" aria-atomic="true">
      <span class="toast-icon" aria-hidden="true">{{ toast.type === 'success' ? '✓' : '!' }}</span>
      <div class="toast-content">
        <strong>{{ toast.type === 'success' ? 'Thành công' : toast.type === 'error' ? 'Có lỗi xảy ra' : 'Lưu ý' }}</strong>
        <p>{{ toast.message }}</p>
      </div>
      <button type="button" class="toast-close" aria-label="Đóng thông báo"
        (click)="notifications.dismiss(toast.id)">×</button>
    </div>
  }
</div>
