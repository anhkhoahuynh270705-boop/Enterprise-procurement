<div class="scanner-overlay" (click)="onBackdropClick($event)">
  <div class="scanner-modal" (click)="$event.stopPropagation()">
    <div class="scanner-header">
      <div class="header-info">
        <h2>Đăng nhập Face ID</h2>
      </div>
      <button
        type="button"
        class="btn-close"
        (click)="close()"
        aria-label="Đóng"
        [disabled]="verified"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <div class="scanner-viewport" [class.verified]="verified" [class.error]="!!cameraError">
      <video #videoElement autoplay playsinline muted></video>
      @if (!verified && !cameraError) {
        <div class="scanner-reticle">
          <div class="reticle-ring"></div>
          <div class="corner-brackets"></div>
          <div class="reticle-laser"></div>
        </div>
      }
      @if (verified) {
        <div class="success-overlay">
          <i class="fa fa-check" aria-hidden="true"></i>
        </div>
      }
      @if (cameraError) {
        <div class="error-overlay">
          <i class="fa fa-exclamation" aria-hidden="true"></i>
        </div>
      }
    </div>
    <div class="scanner-feedback">
      @if (cameraError) {
        <div class="status-badge error">{{ cameraError }}</div>
      } @else if (verified) {
        <div class="status-badge success">Xác thực thành công! Đang chuyển trang…</div>
      } @else {
        <div class="status-badge scanning">
          <span class="pulse-dot"></span>
          Đang quét nhận diện tự động…
        </div>
        <p class="status-hint">{{ hintText }}</p>
      }
    </div>
  </div>
</div>
