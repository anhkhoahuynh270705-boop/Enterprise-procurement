<div class="login-wrapper">
  <video
    #bgVideo
    class="login-background"
    autoplay
    [muted]="true"
    muted
    loop
    playsinline
    preload="auto"
    src="/videos/introduce.mp4"
  ></video>
  <div class="background-overlay" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-header">
      <h1>Đăng nhập</h1>
      <p>Hệ thống Quản lý Mua sắm & Chuỗi cung ứng</p>
    </div>
    <div class="login-form">
      <a class="btn-login" [href]="auth.loginUrl">Đăng nhập tài khoản</a>

      <div class="divider">
        <span>HOẶC</span>
      </div>

      <button type="button" class="btn-face-login" (click)="openFaceScanner()">
        <i class="fa fa-smile-o face-icon" aria-hidden="true"></i>
        <span>Đăng nhập bằng Face ID</span>
      </button>

      <p class="auth-link">Chưa có tài khoản? Vui lòng liên hệ quản trị viên.</p>
    </div>
  </div>

  @if (showFaceScanner) {
    <app-face-scanner
      (closeDialog)="showFaceScanner = false"
      (loginSuccess)="onFaceLoginSuccess()"
    ></app-face-scanner>
  }
</div>
