services:

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: shopping_keycloak

    volumes:
      - ./Keycloak/themes/enterprise:/opt/keycloak/themes/enterprise:ro
      - ./Frontend/public/videos:/opt/keycloak/themes/enterprise/login/resources/videos:ro

    command: start-dev
    restart: unless-stopped

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/shopping_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: Khoa123
      KC_DB_SCHEMA: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_LOG_LEVEL: INFO

    ports:
      - "8081:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - shopping_network


  # KAFKA# 
  kafka:
    image: apache/kafka:4.3.1
    container_name: shopping-kafka
    

    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    networks:
      - shopping_network


  # MAILHOG
  mailhog:
    image: mailhog/mailhog:latest
    container_name: shopping-mailhog

    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - shopping_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopping-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - shopping_network

      

networks:
  shopping_network:
    driver: bridge